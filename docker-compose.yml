x-airflow-common:
  &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./data-lake:/opt/airflow/data-lake

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres:
      condition: service_healthy

services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:13
    container_name: hacker_news_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  # =========================
  # Airflow Init
  # =========================
  airflow-init:
    <<: *airflow-common
    container_name: hacker_news_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    restart: "no"

  # =========================
  # Airflow Webserver
  # =========================
  airflow-webserver:
    <<: *airflow-common
    container_name: hacker_news_airflow_webserver
    command: webserver
    ports:
      - "28080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # =========================
  # Airflow Scheduler
  # =========================
  airflow-scheduler:
    <<: *airflow-common
    container_name: hacker_news_airflow_scheduler
    command: scheduler
    restart: always

# =========================
# Volumes
# =========================
volumes:
  postgres-db-volume: